rootProject.name = 'LabsRunner'

// Каждая папка с MainActivity.java в репозитории — отдельное приложение (модуль).
// Имя модуля = последняя часть пакета: com.example.spacefleet -> :spacefleet
import groovy.io.FileType
import groovy.io.FileVisitResult

def repoRoot = settingsDir.parentFile
def skip = ['.git', '.gradle', '.idea', 'android', 'tools', 'build', 'screenshots']
def apps = [:]
repoRoot.traverse(type: FileType.FILES, nameFilter: 'MainActivity.java',
        preDir: { it.name in skip ? FileVisitResult.SKIP_SUBTREE : FileVisitResult.CONTINUE }) { f ->
    def pkg = (f.getText('UTF-8') =~ /(?m)^package ([\w.]+);/)[0][1]
    apps[pkg.tokenize('.').last()] = [src: f.parentFile, pkg: pkg]
}
gradle.ext.labApps = apps.sort()

gradle.ext.labApps.each { name, info ->
    include ":$name"
    def dir = new File(settingsDir, "apps/$name")
    dir.mkdirs()
    project(":$name").projectDir = dir
}
